<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container / Background Box -->
  <rect width="512" height="512" rx="100" fill="#1D2F57"/>
  
  <!-- Outer Border -->
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="#4A90E2" stroke-width="12" opacity="0.7"/>

  <!-- Subtle Grid Lines (Thicker for scaling) -->
  <line x1="70" y1="140" x2="442" y2="140" stroke="#3B5998" stroke-width="6" stroke-dasharray="10 10" opacity="0.5"/>
  <line x1="70" y1="240" x2="442" y2="240" stroke="#3B5998" stroke-width="6" stroke-dasharray="10 10" opacity="0.5"/>
  <line x1="70" y1="340" x2="442" y2="340" stroke="#3B5998" stroke-width="6" stroke-dasharray="10 10" opacity="0.5"/>

  <!-- Heatmap Scatter Points (Larger r=18, Higher Opacity for crisp downscaling) -->
  <circle cx="110" cy="180" r="18" fill="#20E2D7" opacity="0.6"/>
  <circle cx="150" cy="95"  r="18" fill="#FFD043" opacity="0.55"/>
  <circle cx="225" cy="85"  r="18" fill="#FF9900" opacity="0.65"/>
  <circle cx="290" cy="60"  r="18" fill="#FF3333" opacity="0.7"/>
  <circle cx="355" cy="95"  r="18" fill="#FF9900" opacity="0.6"/>
  <circle cx="170" cy="290" r="18" fill="#44BB44" opacity="0.6"/>
  <circle cx="325" cy="325" r="18" fill="#E040FB" opacity="0.6"/>
  <circle cx="110" cy="425" r="18" fill="#AAAAAA" opacity="0.55"/>
  <circle cx="215" cy="425" r="18" fill="#44BB44" opacity="0.6"/>
  <circle cx="305" cy="425" r="18" fill="#AAAAAA" opacity="0.5"/>
  <circle cx="410" cy="330" r="18" fill="#20E2D7" opacity="0.55"/>

  <!-- Rating Curve Path (Thicker stroke=28) -->
  <path d="M 80 380 L 150 340 L 210 360 L 290 140 L 360 260 L 432 200" 
        fill="none" stroke="#4A90E2" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Joint Circles on Curve Vertices -->
  <circle cx="80"  cy="380" r="10" fill="#FFFFFF"/>
  <circle cx="150" cy="340" r="10" fill="#FFFFFF"/>
  <circle cx="210" cy="360" r="10" fill="#FFFFFF"/>
  <circle cx="360" cy="260" r="10" fill="#FFFFFF"/>
  <circle cx="432" cy="200" r="10" fill="#FFFFFF"/>

  <!-- Peak Point Outer Glow & Highlight Node -->
  <circle cx="290" cy="140" r="42" fill="#FF0000" opacity="0.3"/>
  <circle cx="290" cy="140" r="26" fill="#FF0000"/>
  <circle cx="290" cy="140" r="12" fill="#FFFFFF"/>
</svg>
